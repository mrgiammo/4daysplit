<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e90ff">
<title>4-Day KB/DB Training Plan</title>
<style>
  :root {
    --bg: #0b1220;
    --card: #11182a;
    --muted: #7d8aa5;
    --text: #eaf2ff;
    --accent: #1e90ff;
    --accent-2: #37d67a;
    --danger: #ff4757;
    --shadow: 0 10px 25px rgba(0,0,0,.25);
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
    background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    position: sticky; top: 0; backdrop-filter: blur(10px);
    background: linear-gradient(180deg, rgba(11,18,32,.85) 0%, rgba(11,18,32,.65) 100%);
    padding: 16px 8px; z-index: 10;
  }
  h1 { margin: 0 0 8px; font-size: 22px; }
  .sub { color: var(--muted); font-size: 13px; }
  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 12px; }
  .tab {
    text-align: center; padding: 10px 6px; background: var(--card); border-radius: 12px;
    border: 1px solid transparent; box-shadow: var(--shadow); font-size: 13px;
  }
  .tab.active { border-color: var(--accent); }
  .container { padding: 12px 4px 80px; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; margin-bottom: 14px; }
  .exercise { display: grid; grid-template-columns: 28px 1fr 90px; align-items: center; gap: 10px; padding: 10px 8px; border-radius: 12px; }
  .exercise:hover { background: rgba(255,255,255,.03); }
  .exercise input[type="checkbox"]{ width: 22px; height: 22px; }
  .name { font-weight: 600; }
  .notes { color: var(--muted); font-size: 12px; }
  .inline { display: flex; gap: 8px; align-items: center; }
  .small { font-size: 12px; color: var(--muted); }
  .controls { position: fixed; bottom: 10px; left: 0; right: 0; padding: 12px; }
  .bar { display: flex; gap: 10px; background: var(--card); border-radius: 18px; padding: 12px; box-shadow: var(--shadow); }
  button {
    flex: 1; border: 0; border-radius: 12px; padding: 12px; font-weight: 700; background: var(--accent);
    color: white; box-shadow: var(--shadow);
  }
  button.secondary { background: #26314a; color: var(--text); }
  button.danger { background: var(--danger); }
  input[type="number"]{
    width: 42px; background: #0d1526; color: var(--text); border: 1px solid #223052; border-radius: 8px; padding: 6px;
  }
  .timer { text-align: center; padding: 10px; color: var(--accent-2); font-weight: 700; }
  .muted { color: var(--muted); }
  .badge { padding: 2px 8px; background: #0d2a48; color: #9fd1ff; border-radius: 999px; font-size: 11px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  footer { text-align:center; color: var(--muted); font-size: 12px; padding: 24px 0; }
</style>
</head>
<body>
<header>
  <h1>KB/DB 4-Day Plan</h1>
  <div class="sub">Fat loss • Muscle gain • 4 days/week</div>
  <div class="tabs">
    <div class="tab" data-day="1">Day 1<br><span class="small">Push & Core</span></div>
    <div class="tab" data-day="2">Day 2<br><span class="small">Lower</span></div>
    <div class="tab" data-day="3">Day 3<br><span class="small">Rest</span></div>
    <div class="tab" data-day="4">Day 4<br><span class="small">Pull & Core</span></div>
    <div class="tab" data-day="5">Day 5<br><span class="small">Full Body</span></div>
  </div>
</header>

<div class="container" id="content"></div>

<div class="controls">
  <div class="bar">
    <button id="startTimer">90s Timer</button>
    <button class="secondary" id="resetChecks">Reset Checks</button>
    <button class="danger" id="resetAll">Reset Week</button>
  </div>
  <div class="timer" id="timerDisplay"></div>
</div>

<footer>
  <div>Tip: tap a weight to edit & save. Progress persists offline.</div>
</footer>

<script>
// Training data
const PLAN = {
  1: [
    { name: "Dumbbell Floor Press", sets: 4, reps: "8–12", note: "Press from floor, controlled", id: "floor_press" },
    { name: "Standing DB Overhead Press", sets: 3, reps: 10, note: "Core tight", id: "ohp" },
    { name: "DB Front Raise + Lateral Raise", sets: 3, reps: "12–15", note: "Superset", id: "raise_superset" },
    { name: "Overhead Triceps Extension (1 DB)", sets: 3, reps: 12, note: "Slow eccentric", id: "triceps_oh" },
    { name: "Plank Shoulder Taps", sets: 3, reps: "30s", note: "No hip sway", id: "shoulder_taps" },
    { name: "Russian Twists (KB/DB)", sets: 3, reps: 20, note: "Core tight", id: "russian_twists" },
  ],
  2: [
    { name: "Goblet Squat (KB/DB)", sets: 4, reps: "10–12", note: "Depth + upright chest", id: "goblet_squat" },
    { name: "Bulgarian Split Squat", sets: 3, reps: "10/leg", note: "Use DBs for load", id: "bss" },
    { name: "Romanian Deadlift (DB/KB)", sets: 3, reps: "10–12", note: "Hinge + hamstring stretch", id: "rdl" },
    { name: "Kettlebell Swing", sets: 3, reps: "15–20", note: "Explosive hips", id: "kb_swing" },
    { name: "Glute Bridge (weighted)", sets: 3, reps: 15, note: "2s squeeze at top", id: "glute_bridge" },
    { name: "Calf Raise", sets: 3, reps: 20, note: "Slow eccentric", id: "calf_raise" },
  ],
  3: [
    { name: "Active Recovery", sets: 1, reps: "30–45 min", note: "Walk, stretch, or yoga", id: "recovery" },
  ],
  4: [
    { name: "Single-Arm DB Row", sets: 4, reps: "10/side", note: "Support knee/bench", id: "sa_row" },
    { name: "Bent-Over DB Reverse Fly", sets: 3, reps: "12–15", note: "Upper back focus", id: "rev_fly" },
    { name: "Kettlebell Deadlift", sets: 4, reps: "10–12", note: "Full hip extension", id: "kb_dl" },
    { name: "DB Bicep Curl", sets: 3, reps: 12, note: "Alt or hammer", id: "curl" },
    { name: "Renegade Row", sets: 3, reps: 10, note: "Slow + steady", id: "ren_row" },
    { name: "Side Plank (each)", sets: 3, reps: "30s/side", note: "Obliques", id: "side_plank" },
  ],
  5: [
    { name: "KB Clean & Press", sets: 4, reps: "8–10/side", note: "Explosive", id: "kb_cnp" },
    { name: "DB Thrusters", sets: 3, reps: 10, note: "Squat → press", id: "thrusters" },
    { name: "Walking Lunges", sets: 3, reps: "12/leg", note: "Controlled pace", id: "lunges" },
    { name: "Push-Ups", sets: 3, reps: "12–15", note: "Full ROM", id: "pushups" },
    { name: "Farmer’s Carry", sets: 3, reps: "30s walk", note: "Core + grip", id: "farmers" },
    { name: "Mountain Climbers", sets: 3, reps: "30s", note: "Finisher", id: "mtn_climbers" },
  ]
};

// State helpers
const $ = s => document.querySelector(s);
const content = $("#content");
const tabs = [...document.querySelectorAll(".tab")];

let activeDay = parseInt(localStorage.getItem("activeDay") || "1", 10);
tabs.forEach(t => t.classList.toggle("active", parseInt(t.dataset.day,10) === activeDay));

function key(k){ return `kbdb_${k}`; }
function get(k, def=null){ try{ return JSON.parse(localStorage.getItem(key(k))) ?? def; } catch { return def; } }
function set(k, v){ localStorage.setItem(key(k), JSON.stringify(v)); }

function renderDay(day){
  activeDay = day;
  set("activeDay", day);
  tabs.forEach(t => t.classList.toggle("active", parseInt(t.dataset.day,10) === day));
  content.innerHTML = "";
  const list = PLAN[day] || [];
  const card = document.createElement("div");
  card.className = "card";
  const title = document.createElement("div");
  title.className = "inline";
  title.innerHTML = `<span class="badge">Day ${day}</span><h2 style="margin:0;font-size:18px">Workout</h2>`;
  card.appendChild(title);

  list.forEach((ex, idx) => {
    const row = document.createElement("div");
    row.className = "exercise";

    const chk = document.createElement("input");
    chk.type = "checkbox";
    const chkKey = `chk_${day}_${ex.id}_${idx}`;
    chk.checked = !!get(chkKey, false);
    chk.addEventListener("change", () => set(chkKey, chk.checked));

    const detail = document.createElement("div");
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = ex.name;
    const notes = document.createElement("div");
    notes.className = "notes";
    notes.textContent = `${ex.sets} sets × ${ex.reps} • ${ex.note}`;
    detail.appendChild(name);
    detail.appendChild(notes);

    const metrics = document.createElement("div");
    metrics.className = "inline";
    const w = document.createElement("input");
    w.type = "number"; w.placeholder = "kg";
    w.value = get(`w_${day}_${ex.id}`, "");
    w.addEventListener("change", ()=> set(`w_${day}_${ex.id}`, w.value));
    const r = document.createElement("input");
    r.type = "number"; r.placeholder = "reps";
    r.value = get(`r_${day}_${ex.id}`, "");
    r.addEventListener("change", ()=> set(`r_${day}_${ex.id}`, r.value));
    metrics.appendChild(w);
    metrics.appendChild(r);

    row.appendChild(chk);
    row.appendChild(detail);
    row.appendChild(metrics);
    card.appendChild(row);
  });

  // Tips card
  const tips = document.createElement("div");
  tips.className = "card";
  tips.innerHTML = `
    <div class="inline" style="justify-content:space-between;">
      <div><strong>Tips</strong><div class="muted small">Add weight or reps weekly. Rest 60–90s.</div></div>
      <div class="badge">Nutrition</div>
    </div>
    <div class="muted" style="margin-top:6px;">
      Target ~2,200 kcal, ~180 g protein. Hydrate 2.5–3 L/day. Sleep 7–9 h.
    </div>
  `;
  content.appendChild(card);
  content.appendChild(tips);
}

tabs.forEach(t => t.addEventListener("click", () => renderDay(parseInt(t.dataset.day,10))));

// Timer
let timerId = null, remaining = 90;
function fmt(s){ const m = Math.floor(s/60), sec = (s%60).toString().padStart(2,'0'); return `${m}:${sec}`; }
function updateTimer(){ $("#timerDisplay").textContent = remaining>0 ? `Rest: ${fmt(remaining)}` : "Done!"; }
$("#startTimer").addEventListener("click", () => {
  if(timerId){ clearInterval(timerId); timerId = null; remaining = 90; updateTimer(); return; }
  remaining = parseInt(prompt("Rest seconds?", get("restSec", 90)) || "90", 10);
  set("restSec", remaining);
  updateTimer();
  timerId = setInterval(() => {
    remaining--; updateTimer();
    if(remaining <= 0){ clearInterval(timerId); timerId = null; }
  }, 1000);
});

// Resets
$("#resetChecks").addEventListener("click", () => {
  if(!confirm("Reset all checkboxes for this day?")) return;
  const list = PLAN[activeDay] || [];
  list.forEach((ex, idx) => localStorage.removeItem(key(`chk_${activeDay}_${ex.id}_${idx}`)));
  renderDay(activeDay);
});
$("#resetAll").addEventListener("click", () => {
  if(!confirm("Reset the entire week (all weights, reps, checks)?")) return;
  Object.keys(localStorage).filter(k => k.startsWith("kbdb_")).forEach(k => localStorage.removeItem(k));
  renderDay(1);
});

// Init
renderDay(activeDay);

// Register SW
if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js'));
}
</script>
</body>
</html>
